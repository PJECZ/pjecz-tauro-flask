[project]
name = "pjecz-tauro-flask"
version = "1.5.0"
description = "Sistema de Turnos - Backend"
authors = ["ricval <ricardo.valdes@pjecz.gob.mx>", "Carlos Hdz <carlos.hernandez@pjecz.gob.mx>"]
license = "AGPL3"
readme = "README.md"
requires-python = ">=3.14"
package-mode = false

dependencies = [
    "click>=8.5.0",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "flask-login>=0.6.3",
    "flask-moment>=1.0.6",
    "flask-restful>=0.3.10",
    "flask-socketio>=5.7.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "gunicorn>=26.2.0",
    "hashids>=1.3.1",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "pytz>=2026.6",
    "sqlalchemy>=2.1.6",
    "sqlalchemy-utils>=0.43.0",
    "unidecode>=1.4.0",
    "uvicorn>=0.54.0",
    "werkzeug>=3.1.9",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "faker>=40.44.0",
    "isort>=9.0.2",
    "pre-commit>=4.7.0",
    "pylint>=4.1.3",
    "pylint-sqlalchemy>=0.3.0",
    "pytest>=9.2.0",
    "requests>=2.34.2",
]

[tool.black]
line-length = 128

[tool.isort]
line_length = 128
profile = "black"

[tool.pylint.format]
max-line-length = 128
