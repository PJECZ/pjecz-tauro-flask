info:
  name: Ubicaciones
  type: http
  seq: 6

http:
  method: GET
  url: "{{url_api_key}}/consultar_ubicaciones"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Cada 'ubicación' debe tener id, nombre y numero", function() {
          const data = res.getBody().data;

          data.forEach(function(item) {
            expect(item).to.have.property("id");
            expect(item).to.have.property("nombre");
            expect(item).to.have.property("numero");
          });
        });

        test("Verificar el tipo de variable de cada propiedad del objeto ubicación", function() {
          const data = res.getBody().data;
          const tipo = data[0];
          
          expect(tipo.id).to.be.a("number");
          expect(tipo.nombre).to.be.a("string");
          expect(tipo.numero).to.be.a("number");
        });
  assertions:
    - expression: res.body.data[0]
      operator: isJson
    - expression: res.body.data[0].id
      operator: isNumber

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
