info:
  name: Estados
  type: http
  seq: 3

http:
  method: GET
  url: "{{url_api_key}}/consultar_turnos_estados"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Cada 'estado' debe tener id y nombre", function() {
          const data = res.getBody().data;

          data.forEach(function(item) {
            expect(item).to.have.property("id");
            expect(item).to.have.property("nombre");
          });
        });

        test("Debe incluir todos los nombres esperados", function() {
          const nombres = res.getBody().data.map(item => item.nombre);

          const esperados = [
            "ATENDIENDO",
            "ATENDIENDO EN CUBICULO",
            "CANCELADO",
            "COMPLETADO",
            "EN ESPERA",
            "EN ESPERA DE CUBICULO",
            "PASE A CUBICULO",
            "PASE A UBICACION"
          ];

          expect(nombres).to.include.members(esperados);
          
          console.log("Nombre de estados: " + esperados)
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
