info:
  name: Autentificar con Falla
  type: http
  seq: 1

http:
  method: GET
  url: "{{url_api_key}}/test_conexion"
  auth: inherit

runtime:
  variables:
    - name: api_key
      value: "123"
  scripts:
    - type: after-response
      code: 'console.log("Mensaje de Falla de autentificación: " + res.body.message)'
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.body.success
      operator: isFalsy
    - expression: res.body.message
      operator: isDefined
    - expression: res.body.data
      operator: isNull

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
